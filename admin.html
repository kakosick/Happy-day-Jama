<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>VELVET — admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css"></head>
<body><main>
<h1>VELVET <small>admin</small></h1>
<form id="login" novalidate>
  <label>Email<input id="em" type="email" autocomplete="username" required></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
  <button class="b" type="submit">Sign in</button><p id="lerr" role="alert"></p>
</form>
<section id="panel" hidden>
  <div class="bar"><button class="b" id="refresh">Refresh</button><button class="b" id="logout">Sign out</button><span id="count"></span></div>
  <p id="note"></p><ul id="list"></ul>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/admin.js"></script>
</body></html>
