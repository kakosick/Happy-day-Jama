<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELVET — for Yuki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="icon" type="image/png" href="https://i.pinimg.com/originals/be/39/0b/be390baa77492d282578b169d3a2a034.png">
</head>
<body class="lock">
<canvas id="fx" aria-hidden="true"></canvas>

<div id="intro" role="dialog" aria-label="VELVET">
  <div class="ring" id="ring"></div>
  <div class="ia tag" id="i1" data-t="tagline"></div>
  <div class="ia logo" id="i2">VELVET</div>
  <div class="ia for" id="i3" data-t="for"></div>
  <button class="ia btn" id="enter" data-t="enter"></button>
</div>

<nav id="nav" style="opacity:0"><b>VELVET</b>
  <div class="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">EN</button><button data-l="ru" aria-pressed="false">RU</button></div>
</nav>

<main>
<section id="welcome"><div class="glow"></div><div class="wrap">
  <h1 class="big rv" data-t="dear"></h1>
  <p class="lead rv" data-t="today"></p>
  <p class="rv" data-t="welcomeBody"></p>
</div></section>

<section id="world"><div class="wrap">
  <h2 class="rv" data-t="worldH"></h2>
  <div class="cards">
    <article class="card rv"><h3 data-t="c1h"></h3><p data-t="c1p"></p></article>
    <article class="card rv"><h3 data-t="c2h"></h3><p data-t="c2p"></p></article>
    <article class="card rv"><h3 data-t="c3h"></h3><p data-t="c3p"></p></article>
  </div>
</div></section>

<section id="memory"><div class="wrap mem">
  <h2 class="rv" data-t="memH"></h2>
  <figure class="pol rv"><div class="ph" id="ph"><span id="phEmpty"><span data-t="phText"></span><br><br><label><input type="file" accept="image/*" id="phFile" hidden><span data-t="phBtn"></span></label></span></div>
  <figcaption class="cap" data-t="cap"></figcaption></figure>
</div></section>

<section id="music"><div class="wrap">
  <h2 class="rv" data-t="musicH"></h2>
  <div class="player rv" id="player">
    <div class="disc" aria-hidden="true"><i id="art">♪</i></div>
    <div>
      <div class="empty" id="empty" data-t="empty"></div>
      <div class="tt" id="tt"></div><div class="ar" id="ar"></div>
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div><span id="fill"></span></div></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <div class="ctl">
        <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
        <button id="pp" class="pp" aria-label="Play"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></button>
      </div>
      <ul class="pl" id="pl"></ul>
    </div>
  </div>
</div></section>

<section id="letter"><div class="wrap" style="text-align:center">
  <h2 class="rv" data-t="letterH"></h2>
  <div class="env rv" id="env">
    <button class="envbtn" id="envbtn" aria-expanded="false" aria-controls="paper" aria-label="Open letter"><span class="back"></span><span class="front"></span><span class="flap"></span><span class="seal"></span></button>
    <div class="hint" id="hint" data-t="letterHint"></div>
  </div>
  <div class="paper" id="paper" style="text-align:left"></div>
</div></section>

<section id="message"><div class="wrap">
  <h2 class="rv" data-t="gbH"></h2>
  <p class="lead rv" data-t="gbSub"></p>
  <form id="gbForm" class="gb rv" novalidate>
    <label><span data-t="gbName"></span><input id="gbN" value="Yuki" maxlength="60" autocomplete="off"></label>
    <label><span data-t="gbMsg"></span><textarea id="gbM" rows="6" maxlength="2000"></textarea></label>
    <button class="btn" id="gbSend" type="submit" data-t="gbSend"></button>
    <p id="gbStatus" role="status" aria-live="polite"></p>
  </form>
  <div class="ok" id="gbOk" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="M20 33l8 8 16-17"/></svg><p data-t="gbOk"></p></div>
</div></section>

<section id="finale"><div class="wrap">
  <h2 class="rv" data-t="finH"></h2>
  <p class="rv lead" data-t="finP"></p>
  <div class="sig rv" data-t="sig"></div>
</div>
<button id="star" aria-label="A tiny star"><svg viewBox="0 0 24 24"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg></button>
</section>
</main>

<div id="secret" role="dialog" aria-modal="true" aria-label="Secret">
  <blockquote data-t="secretMsg"></blockquote><em data-t="secretNote"></em>
  <button class="btn" id="sclose" data-t="close"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js" defer></script>
<script src="js/supabase.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/music.js" defer></script>
<script src="js/animations.js" defer></script>
<script src="js/guestbook.js" defer></script>
</body>
</html>
